version: v1.1.0
steps:
# Build target image
- build: -t {{.Run.Registry}}/spring-app-jp:{{.Run.ID}} ./demo
# Run image 
- cmd: 
  - docker run -d --name test -t {{.Run.Registry}}/spring-app-jp:{{.Run.ID}} 
  - ports: ["8080:80"]
- cmd: docker stop test
  id: stop-test
# Push image
- push:
  - {{.Run.Registry}}/spring-app-jp:{{.Run.ID}}